<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Sequencer</title>
    <link rel="stylesheet" href="/src/main.css" />
  </head>
  <body>
    <div class="app-header">
      <div class="app-header-left">
        <button
          id="play-stop-button"
          class="play-stop-button"
          aria-label="Play"
          disabled
        >
          ▶
        </button>
        <h1>Grid Sequencer</h1>
        <button id="patch-button" disabled>Patch…</button>
        <button
          id="undo-button"
          class="icon-button"
          disabled
          aria-label="Undo"
          title="Undo (Ctrl/Cmd+Z)"
        >
          ↶
        </button>
        <button
          id="redo-button"
          class="icon-button"
          disabled
          aria-label="Redo"
          title="Redo (Ctrl/Cmd+Shift+Z)"
        >
          ↷
        </button>
      </div>
      <button
        id="manage-library-button"
        class="icon-button"
        disabled
        aria-label="Manage Library"
        title="Manage Library"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 6.2c-1.5-1.2-3.5-1.8-6-1.8-.6 0-1 .4-1 1v12.6c0 .6.4 1 1 1 2.5 0 4.5.6 6 1.8 1.5-1.2 3.5-1.8 6-1.8.6 0 1-.4 1-1V5.4c0-.6-.4-1-1-1-2.5 0-4.5.6-6 1.8Z" />
          <path d="M12 6.2v13.6" />
        </svg>
      </button>
    </div>
    <div id="unlock"></div>
    <div id="app" class="hidden">
      <div class="transport">
        <div id="sequencer-transport" class="sequencer-transport">
          <button id="master-button">Master…</button>
          <div
            id="master-meter"
            class="master-meter"
            title="Master output level (post-limiter -- exactly what's actually heard)"
          >
            <div class="master-meter-fill"></div>
          </div>
          <button
            id="more-like-this-button"
            title="Nudge every row's knobs, a fraction of the steps, and the master/send-bus chains a little -- click again to wander further"
          >
            More like this
          </button>
          <button id="record-button">Record</button>
          <span id="record-status" class="status-text"></span>
          <label>
            Tempo
            <input id="bpm" type="number" min="20" max="300" step="1" value="120" />
            BPM
          </label>
          <label>
            Subdivision
            <select id="subdivision"></select>
          </label>
          <label>
            Steps
            <input id="column-count" type="number" min="1" max="32" step="1" value="8" />
          </label>
          <label>
            Row/column precedence
            <select id="precedence-select">
              <option value="row">Row wins</option>
              <option value="column">Column wins</option>
            </select>
          </label>
          <label>
            Key
            <select id="key-select"></select>
          </label>
          <label>
            Scale
            <select id="scale-select"></select>
          </label>
        </div>
      </div>
      <div id="sequencer-view">
        <div class="main-layout">
          <div id="grid"></div>
          <div class="library-column">
            <div class="config-panel library-panel">
              <div class="library-panel-title-row">
                <span class="library-panel-title">Sample Library</span>
              </div>
              <div id="sample-library"></div>
            </div>
            <div class="config-panel library-panel">
              <div class="library-panel-title-row">
                <span class="library-panel-title">Instrument Library</span>
              </div>
              <div id="instrument-library"></div>
            </div>
            <div class="config-panel library-panel">
              <div class="library-panel-title-row">
                <span class="library-panel-title">Effect Library</span>
              </div>
              <div id="effect-library"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="library-management-view" class="hidden">
        <div class="management-section">
          <div class="management-section-header">
            <h2>Samples</h2>
            <button id="add-sample-button">+ Add sample…</button>
          </div>
          <div id="sample-management"></div>
        </div>
        <div class="management-section">
          <h2>Instrument Presets</h2>
          <div id="instrument-preset-management"></div>
        </div>
        <div class="management-section">
          <h2>Effect Chain Presets</h2>
          <div id="effect-chain-preset-management"></div>
        </div>
      </div>
    </div>
  </body>
  <script type="module" src="/src/main.ts"></script>
</html>
